
name: Flipper Ethernet Toolkit - Momentum mntm-012

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: W5500 app for mntm-012
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build with exact Momentum mntm-012 SDK
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-hw-target: f7
          sdk-url: https://github.com/Next-Flip/Momentum-Firmware/releases/download/mntm-012/flipper-z-f7-sdk-mntm-012.zip
          app-dir: .

      - name: Upload ready-to-install FAP
        uses: actions/upload-artifact@v4
        with:
          name: Flipper-Ethernet-Toolkit-mntm-012
          path: ${{ steps.build.outputs.fap-artifacts }}
          if-no-files-found: error
